spring.application.name=backend

# Render가 PORT를 넣어준다. 로컬은 8080
server.port=${PORT:8080}

# MySQL
# 배포(Render)에서는 DB_URL 환경변수로 덮어쓴다. 없으면 로컬 MySQL 사용
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/one_step?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 테이블이 맞는지 검사만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 시간은 DB에 UTC로 저장
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
